<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site.domain}}/assets/images/logos/G-main.png">
  <meta name="theme-color" content="#1b2b48">
  <link rel="icon" type="image/png" href="/assets/images/logos/G-main-128.png">
  <link rel="apple-touch-icon" href="/assets/images/logos/G-main-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/gide.css">
  <link rel="stylesheet" href="/assets/css/catalog.css">
</head>
<body class="catalog">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="catalog-header catalog-wrap">
    <a class="brand" href="/" aria-label="Gide home">
      <img src="/assets/images/logos/G-main-128.png" alt="" width="40" height="40">
      <span class="brand-name">Gide</span>
    </a>
    <a href="/support.html">Support</a>
  </header>
  <main id="main" class="catalog-wrap">
{{content}}
  </main>
  <footer class="catalog-footer catalog-wrap">
    <p>Made by Gide. <span>© {{year}} Gide.</span></p>
    <nav aria-label="Footer"><a href="/">Gide home</a><a href="/privacy.html">Privacy</a><a href="/support.html">Support</a></nav>
  </footer>
</body>
</html>
